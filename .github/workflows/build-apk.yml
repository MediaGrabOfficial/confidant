name: Compiler l'APK Confidant

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then SDK_ROOT="/usr/local/lib/android/sdk"; fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find -L "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager introuvable" >&2; exit 1; fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - name: Check embedded JavaScript
        run: node scripts/check-html.mjs
      - name: Compile Debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Confidant-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
